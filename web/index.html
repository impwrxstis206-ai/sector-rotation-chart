<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>セクターローテーション</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
</head>
<body>
  <header>
    <h1>セクターローテーション <small>TOPIX比 相対強度</small></h1>
    <div id="updated" class="muted"></div>
  </header>

  <section class="controls">
    <div class="row">
      <div class="seg" id="interval">
        <button data-v="30m">30分足</button>
        <button data-v="60m">60分足</button>
        <button data-v="1d">日足</button>
      </div>
      <div class="seg" id="mode">
        <button data-v="rs" title="(P/P₀)÷(B/B₀)−1">TOPIX比</button>
        <button data-v="pct" title="P/P₀−1">単純変化率</button>
      </div>
    </div>
    <div class="row">
      <label>基準 <input type="datetime-local" id="base-input"></label>
      <div class="presets" id="presets">
        <button data-p="open">今日の寄り</button>
        <button data-p="prevclose">前日大引け</button>
        <button data-p="1w">1週間前</button>
        <button data-p="1m">1ヶ月前</button>
        <button data-p="3m">3ヶ月前</button>
      </div>
    </div>
    <div class="row">
      <label>終点 <input type="datetime-local" id="end-input"></label>
      <button id="end-latest">最新</button>
      <label class="check"><input type="checkbox" id="click-base"> グラフのクリックで基準点を設定</label>
    </div>
    <div id="base-info" class="info"></div>
  </section>

  <main>
    <section class="chart-wrap">
      <div id="chart"></div>
    </section>
    <aside class="ranking">
      <div class="rank-head">
        <h2>ランキング</h2>
        <label>傾き <select id="slope-n">
          <option value="1">直近1本</option>
          <option value="3">直近3本</option>
          <option value="6">直近6本</option>
          <option value="12">直近12本</option>
        </select></label>
      </div>
      <div id="rank-list"></div>
      <p class="muted small">バー＝終点のRS／右列＝直近N本でのRSの変化（＋は資金流入が加速）。行をタップで表示切替。</p>
    </aside>
  </main>

  <details class="legend" id="legend-box" open>
    <summary>銘柄の表示 / 非表示</summary>
    <div class="row">
      <button id="show-all">全表示</button>
      <button id="show-top">上位5 / 下位5</button>
      <button id="show-none">全非表示</button>
      <label class="check"><input type="checkbox" id="semi-bold" checked> 半導体を強調</label>
    </div>
    <div id="legend"></div>
  </details>

  <footer class="muted small">
    データ: Yahoo Finance（yfinance、遅延あり）。ベンチマークは 1306（TOPIX連動ETF）。約定の無い足は前の足の終値で補完（ツールチップに「約定なし」）。
  </footer>

  <script src="app.js"></script>
</body>
</html>
