name: update-data

on:
  schedule:
    # cron は UTC。JST = UTC+9
    - cron: "5,35 0-5 * * 1-5"   # JST 9:05〜14:35 の30分ごと（取引時間中）
    - cron: "5,40 6 * * 1-5"     # JST 15:05 / 15:40（大引け直後）
    - cron: "30 7 * * 1-5"       # JST 16:30（引け後の日足確定）
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "config/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch data
        # 取得に失敗しても前回データでサイトは公開し続ける
        continue-on-error: true
        run: python scripts/fetch.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: update $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') JST"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi

      - name: Build site
        run: |
          mkdir _site
          cp -r web/* _site/
          cp -r config data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
